name: Build Obfuscate BPB Panel

on:
  push:
    branches:
      - main
  schedule:
    # 每天 1 点运行
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Check out the code
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      # 3. 安装 Obfuscator
      - name: Install dependencies
        run: |
          npm install -g javascript-obfuscator

      # 4. 下载最新 BPB 源代码
      - name: Download latest BPB worker
        run: |
          wget -O origin.js https://raw.githubusercontent.com/bia-pain-bache/BPB-Worker-Panel/main/build/unobfuscated-worker.js || true

      # 5. 混淆 Obfuscate
      - name: Obfuscate BPB worker js
        run: |
          javascript-obfuscator origin.js --output _worker.js \
          --compact true \
          --control-flow-flattening true \
          --control-flow-flattening-threshold 1 \
          --dead-code-injection true \
          --dead-code-injection-threshold 1 \
          --identifier-names-generator hexadecimal \
          --rename-globals true \
          --string-array true \
          --string-array-encoding 'rc4' \
          --string-array-threshold 1 \
          --transform-object-keys true \
          --unicode-escape-sequence true

      # 6. 上传 _worker.js 和 origin.js 作为 artifact
      - name: Upload obfuscated worker as artifact
        uses: actions/upload-artifact@v3
        with:
          name: bpb-worker
          path: |
            _worker.js
            origin.js
